<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050a12">
  <title>世界资讯｜GlobalNavigator</title>
  <style>
    :root{color-scheme:dark;--bg:#050a12;--panel:#0d1924;--line:rgba(155,201,225,.18);--text:#edf5fa;--muted:#9aaebb;--aqua:#72d8df}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 70% -15%,#18344a 0,transparent 38%),var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
    a{color:inherit}.top{position:sticky;top:0;z-index:5;background:rgba(5,10,18,.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
    .bar{max-width:1180px;margin:auto;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{font-weight:700;text-decoration:none;letter-spacing:.02em}.nav{display:flex;gap:20px}.nav a{text-decoration:none;color:var(--muted);font-size:14px}.nav a[aria-current=page],.nav a:hover{color:var(--aqua)}
    main{max-width:1180px;margin:0 auto;padding:52px 24px 80px}.eyebrow{color:var(--aqua);font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:700}
    h1{margin:10px 0 8px;font-size:clamp(30px,5vw,48px);line-height:1.15}.intro{max-width:720px;color:var(--muted);margin:0}
    .tools{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:30px 0 18px;padding:16px;border:1px solid var(--line);border-radius:16px;background:rgba(13,25,36,.78)}
    .filters{display:flex;gap:8px;flex-wrap:wrap}.filter{border:1px solid var(--line);border-radius:999px;padding:8px 13px;background:transparent;color:var(--muted);font:inherit;font-size:13px;cursor:pointer}.filter[aria-pressed=true]{border-color:var(--aqua);color:var(--text);background:rgba(79,181,192,.16)}
    #status{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .card{min-width:0;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,rgba(16,34,48,.94),rgba(9,19,29,.95));padding:20px;transition:border-color .2s,transform .2s}
    .card:hover{border-color:rgba(114,216,223,.55);transform:translateY(-2px)}.meta{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px;flex-wrap:wrap}.tag{color:var(--aqua);border:1px solid rgba(114,216,223,.25);border-radius:999px;padding:2px 8px}
    .card h2{font-size:18px;line-height:1.45;margin:12px 0 8px}.card h2 a{text-decoration:none}.card h2 a:hover{color:var(--aqua)}.card p{color:#b6c4ce;font-size:14px;margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
    .empty{grid-column:1/-1;border:1px dashed var(--line);border-radius:16px;padding:28px;color:var(--muted);text-align:center}.footer{color:#738794;font-size:12px;margin-top:28px}
    @media(max-width:700px){.bar{padding:14px 18px}main{padding:36px 18px 60px}.grid{grid-template-columns:1fr}.tools{align-items:flex-start}.filters{width:100%}}
  </style>
</head>
<body>
  <header class="top"><div class="bar"><a class="brand" href="./index.html#hero">GlobalNavigator</a><nav class="nav" aria-label="主导航"><a href="./index.html#hero">首页</a><a href="./news.html" aria-current="page">世界资讯</a><a href="./index.html#hero">开始探索</a></nav></div></header>
  <main>
    <div class="eyebrow">GlobalNavigator · World Briefing</div>
    <h1>国际贸易动态</h1>
    <p class="intro">汇集全球贸易政策、关税与供应链资讯。点击条目可查看来源原文；资讯用于动态参考，具体政策与数据请以来源页面为准。</p>
    <section class="tools" aria-label="新闻筛选">
      <div class="filters" role="group" aria-label="按地区筛选">
        <button class="filter" type="button" data-continent="all" aria-pressed="true">全部地区</button>
        <button class="filter" type="button" data-continent="north-america" aria-pressed="false">北美洲</button>
        <button class="filter" type="button" data-continent="south-america" aria-pressed="false">南美洲</button>
        <button class="filter" type="button" data-continent="europe" aria-pressed="false">欧洲</button>
        <button class="filter" type="button" data-continent="africa" aria-pressed="false">非洲</button>
        <button class="filter" type="button" data-continent="asia" aria-pressed="false">亚洲</button>
        <button class="filter" type="button" data-continent="oceania" aria-pressed="false">大洋洲</button>
      </div>
      <div id="status" role="status" aria-live="polite">正在加载资讯…</div>
    </section>
    <section class="grid" id="news-list" aria-label="新闻列表" aria-busy="true"></section>
    <p class="footer" id="source-note">新闻来源与更新时间将在加载后显示。</p>
  </main>
  <script>
    (() => {
      const list=document.querySelector('#news-list'),status=document.querySelector('#status'),note=document.querySelector('#source-note');
      let allItems=[],continent='all';
      const regions={all:'全部地区','north-america':'北美洲','south-america':'南美洲',europe:'欧洲',africa:'非洲',asia:'亚洲',oceania:'大洋洲'};
      const labels={policy:'政策与监管',tariff:'关税动态',supply:'贸易与供应链'};
      const dateText=value=>{const d=new Date(value);return Number.isNaN(d.getTime())?'时间未标注':new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(d)};
      const render=()=>{
        const items=allItems.filter(item=>continent==='all'||item.continent===continent).slice(0,60);
        list.replaceChildren();
        if(!items.length){const empty=document.createElement('div');empty.className='empty';empty.textContent=allItems.length?'该地区暂时没有匹配资讯。':'暂时没有可显示的资讯，请稍后刷新。';list.append(empty);}
        for(const item of items){
          const card=document.createElement('article');card.className='card';
          const meta=document.createElement('div');meta.className='meta';
          const tag=document.createElement('span');tag.className='tag';tag.textContent=labels[item.category]||'贸易资讯';
          const region=document.createElement('span');region.textContent=regions[item.continent]||item.sourceCountry||'全球';
          const date=document.createElement('time');date.dateTime=item.pubDate||'';date.textContent=dateText(item.pubDate);
          meta.append(tag,region,date);
          const heading=document.createElement('h2'),link=document.createElement('a');link.textContent=item.title||'未命名资讯';
          try{const u=new URL(item.link);link.href=u.protocol==='https:'?u.href:'#';}catch{link.href='#'}
          if(link.href!=='#'){link.target='_blank';link.rel='noopener noreferrer';}
          heading.append(link);
          const desc=document.createElement('p');desc.textContent=item.description||'请查看来源页面了解详细信息。';
          card.append(meta,heading,desc);list.append(card);
        }
        list.setAttribute('aria-busy','false');
        status.textContent=items.length?'显示 '+items.length+' 条资讯'+(allItems.length>items.length?'（按更新时间排序）':''):'暂无匹配资讯';
      };
      document.querySelectorAll('.filter').forEach(button=>button.addEventListener('click',()=>{continent=button.dataset.continent;document.querySelectorAll('.filter').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));render();}));
      fetch('./trade-updates.json',{cache:'no-store',headers:{Accept:'application/json'}}).then(response=>{if(!response.ok)throw new Error('资讯源暂时不可用');return response.json();}).then(payload=>{
        allItems=(Array.isArray(payload.items)?payload.items:[]).filter(item=>item&&item.title).sort((a,b)=>new Date(b.pubDate||0)-new Date(a.pubDate||0));
        render();note.textContent='来源：'+(payload.source||'公开新闻与政府公告')+' · 更新时间：'+dateText(payload.updatedAt)+' · 点击标题查看原文';
      }).catch(()=>{list.setAttribute('aria-busy','false');status.textContent='资讯暂时无法加载';list.innerHTML='<div class="empty">新闻源暂时没有响应。请稍后重试或返回首页。</div>';note.textContent='资讯源连接失败；请稍后刷新页面。';});
    })();
  </script>
</body>
</html>
