    const renderAgentInline = (parent,text) => {

    const reportProgressMessages=['正在搜寻资料','正在思考问题','正在核验来源','正在分析数据','正在检查合规要点','正在编辑页面','正在整理本地化内容','正在形成业务建议'];

    const buildReportLoadingShell=()=>{

      else if(topicResults.getAttribute('aria-busy')==='true')topicStatus.textContent=window.siteT('topic_loading');
    });
    const updateRefreshButton = () => {
      const remaining = Math.max(0, Math.ceil((refreshCooldownUntil - Date.now()) / 1000));
      const cooling = remaining > 0;
      refreshButton.dataset.cooldown = String(cooling);
      refreshButton.disabled = isLoading || cooling;
      const label = document.querySelector('#news-refresh-label');
      if (!label) return;
      label.textContent = cooling
        ? window.siteT('refresh_cooldown').replace('{seconds}', remaining)
        : isLoading ? window.siteT('refresh_loading') : window.siteT('refresh_news');
    };
    const startRefreshCooldown = () => {
      refreshCooldownUntil = Date.now() + 5000;
      clearInterval(refreshCooldownTimer);
      updateRefreshButton();
      refreshCooldownTimer = setInterval(() => {
        updateRefreshButton();
        if (Date.now() >= refreshCooldownUntil) {
          clearInterval(refreshCooldownTimer);
          refreshCooldownTimer = null;
        }
      }, 200);
    };
    const categories = [
      { id:'policy', titleKey:'policy', subtitleKey:'policy_subtitle', image:'assets/trade-policy.png', icon:'assets/file-lines.svg', keywords:['贸易政策','贸易协定','贸易协议','出口管制','市场准入','商务部','加工贸易','保税维修'] },
      { id:'tariff', titleKey:'tariff', subtitleKey:'tariff_subtitle', image:'assets/tariff-inspection.png', icon:'assets/cube.svg', keywords:['关税','反倾销','反补贴','进口配额','出口配额','贸易救济','保障措施'] },
      { id:'supply', titleKey:'supply', subtitleKey:'supply_subtitle', image:'assets/supply-chain.png', icon:'assets/ship.svg', keywords:['供应链','物流','航运','港口','海关总署','进出口统计','中欧班列'] }
    ];
    const mapRegions = [
      { id:'north-america', zh:'北美洲', en:'North America', countries:['United States','United States of America','Canada','Mexico'] },
      { id:'south-america', zh:'南美洲', en:'South America', countries:['Brazil','Argentina','Chile','Colombia','Peru','Uruguay','Ecuador','Venezuela'] },
      { id:'europe', zh:'欧洲', en:'Europe', countries:['United Kingdom','Great Britain','France','Germany','Italy','Spain','Netherlands','Belgium','Switzerland','Sweden','Norway','Poland','Ukraine','Portugal','Ireland','Austria','Denmark','Finland','Greece','Czech Republic','Czechia','Romania'] },
      { id:'africa', zh:'非洲', en:'Africa', countries:['South Africa','Nigeria','Egypt','Kenya','Ghana','Ethiopia','Morocco','Algeria','Tanzania','Uganda','Senegal'] },
      { id:'asia', zh:'亚洲', en:'Asia', countries:['China','Japan','India','South Korea','Republic of Korea','Singapore','Hong Kong','Taiwan','Indonesia','Malaysia','Thailand','Vietnam','Pakistan','Philippines','Bangladesh','United Arab Emirates','Saudi Arabia','Israel'] },
      { id:'oceania', zh:'大洋洲', en:'Oceania', countries:['Australia','New Zealand'] }
    ];
    const renderDetailedWorldMap = () => {
      const rings = window.globalNavigatorLandRings;
      if (!Array.isArray(rings)) return;
      const outlines = [];
      for (const ring of rings) {
        if (!Array.isArray(ring) || ring.length < 3) continue;
        const averageLatitude = ring.reduce((sum, point) => sum + point[1], 0) / ring.length;
        if (averageLatitude < -60) continue;
        let path = '';
        for (let index = 0; index < ring.length; index++) {
          const [longitude, latitude] = ring[index];
          if (!Number.isFinite(longitude) || !Number.isFinite(latitude)) continue;
          const x = ((longitude + 180) / 360) * 240;
          const y = ((90 - latitude) / 180) * 104;
          path += `${index === 0 ? 'M' : 'L'}${x.toFixed(2)} ${y.toFixed(2)}`;
        }
        outlines.push(`${path}Z`);
      }
      const land = document.createElementNS('http://www.w3.org/2000/svg','path');
      land.classList.add('world-map-detailed-land');
      land.setAttribute('d',outlines.join(''));
      land.setAttribute('fill-rule','evenodd');
      document.querySelector('#world-map').insertBefore(land,document.querySelector('#world-map').firstChild);
    };
    renderDetailedWorldMap();
    let selectedRegion = null;
    const selectedRegionData = () => mapRegions.find(region => region.id === selectedRegion);
    const visibleNewsItems = () => {
      const region = selectedRegionData();
      if (!region) return newsItems;
      return newsItems.filter(item => item.continent
        ? item.continent === region.id
        : region.countries.some(country => (item.sourceCountry || '').toLocaleLowerCase().includes(country.toLocaleLowerCase())));
    };
    const updateMapLabels = () => {
      const english = window.siteLanguage === 'en';
      document.querySelector('#world-map-title').textContent = english ? 'WORLD MAP' : '世界地图';
      document.querySelector('.world-map-card').setAttribute('aria-label', english ? 'World map news filter' : '世界地图新闻筛选');
      document.querySelector('#world-map').setAttribute('aria-label', english ? 'Filter stories by publisher region' : '按新闻来源地区筛选');
      mapInstruction.textContent = english ? 'Select Asia to view China trade updates' : '点击亚洲查看中国贸易动态';
      mapButtons.forEach(button => {
        const region = mapRegions.find(item => item.id === button.dataset.region);
        const label = english ? region.en : region.zh;
        button.setAttribute('aria-label', label);
        button.querySelector('title').textContent = label;
      });
    };
    const updateMapSelection = () => {
      const english = window.siteLanguage === 'en';
      const region = selectedRegionData();
      mapSelection.textContent = region ? (english ? region.en : region.zh) : (english ? 'All regions' : '全部地区');
      mapInstruction.textContent = region
        ? (english ? 'Click again to show all news' : '再点一次恢复全部新闻')
        : (english ? 'Click Asia to view China trade updates' : '点击亚洲查看中国贸易动态');
      mapButtons.forEach(button => {
        const active = button.dataset.region === selectedRegion;
        button.classList.toggle('is-selected', active);
        button.setAttribute('aria-pressed', String(active));
      });
    };
    mapButtons.forEach(button => {
      const selectRegion = () => {
        selectedRegion = selectedRegion === button.dataset.region ? null : button.dataset.region;
        updateMapSelection();
        renderNews();
      };
      button.addEventListener('click', selectRegion);
      button.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); selectRegion(); }
      });
    });
    // 地球大洲点击联动
    window.addEventListener('globe-continent-click', (event) => {
      const regionId = event.detail.region;
      selectedRegion = selectedRegion === regionId ? null : regionId;
      updateMapSelection();
      renderNews();
      // 滚动到世界新闻页面
      const worldPage = document.querySelector('#world-page');
      if (worldPage && worldPage.getBoundingClientRect().top > window.innerHeight * 0.5) {
        worldPage.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });
    const getPulseItems = () => {
      const seen = new Set();
      return newsItems
        .filter(item => item?.title && item?.link && item?.pubDate)
        .sort((a,b) => (new Date(b.pubDate).getTime() || 0) - (new Date(a.pubDate).getTime() || 0))
        .filter(item => {
          const headline = (item.title || '').split(/\s+-\s+/)[0].toLocaleLowerCase().replace(/[^a-z0-9\u4e00-\u9fff]/g,'');
          if (!headline || seen.has(headline)) return false;
          seen.add(headline);
          return true;
        })
        .slice(0,16);
    };
    const updateTradePulse = () => {
      const english = window.siteLanguage === 'en';
      pulseLabel.textContent = english ? 'GLOBAL TRADE PULSE' : '全球贸易速览';
      pulseCaption.textContent = english ? 'China News Service and CGTN, MOFCOM policy and Customs statistics' : '中国新闻网与 CGTN 全球市场资讯 · 商务部公告 · 海关统计';
      sectionTitle.textContent = english ? 'TOPIC STREAMS' : '主题频道';
      const items = getPulseItems();
      activePulseIndex = items.length ? activePulseIndex % items.length : 0;
      const item = items[activePulseIndex];
      if (!item) {
        pulseHeadline.removeAttribute('href');
        pulseHeadline.setAttribute('aria-disabled', 'true');
        pulseHeadline.textContent = newsUnavailable ? window.siteT('news_unavailable') : isLoading ? window.siteT('news_fetching') : window.siteT('news_enter');
        pulseSource.textContent = window.siteT('official_trade_source');
        pulseTime.textContent = '—';
        pulseTime.removeAttribute('datetime');
        return;
      }
      const fullTitle = item.title || window.siteT('story_fallback');
      const separator = fullTitle.lastIndexOf(' - ');
      const publisher = separator > 0 ? fullTitle.slice(separator + 3) : '';
      pulseHeadline.href = item.link;
      pulseHeadline.removeAttribute('aria-disabled');
      pulseHeadline.textContent = publisher ? fullTitle.slice(0, separator) : fullTitle;
      pulseSource.textContent = item.author || publisher || window.siteT('official_trade_source');
      pulseTime.textContent = formatPublished(item.pubDate);
      if (item.pubDate && !Number.isNaN(new Date(item.pubDate).getTime())) pulseTime.dateTime = new Date(item.pubDate).toISOString();
      else pulseTime.removeAttribute('datetime');
    };
    const pulseCard = document.querySelector('.hero-trade-pulse');
    const pulseMeta = document.querySelector('.trade-pulse-meta');
    const pulseMotionTargets = [pulseHeadline.parentElement,pulseMeta];
    let pulsePointerInside = false;
    let pulseFocusInside = false;
    const rotateTradePulse = () => {
      const items = getPulseItems();
      if (items.length < 2 || pulsePointerInside || pulseFocusInside || document.hidden || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const nextIndex = (activePulseIndex + 1) % items.length;
      pulseMotionTargets.forEach(target => target.classList.add('is-changing'));
      setTimeout(() => {
        activePulseIndex = nextIndex;
        updateTradePulse();
        requestAnimationFrame(() => pulseMotionTargets.forEach(target => target.classList.remove('is-changing')));
      },180);
    };
    pulseCard.addEventListener('pointerenter', () => { pulsePointerInside = true; });
    pulseCard.addEventListener('pointerleave', () => { pulsePointerInside = false; });
    pulseCard.addEventListener('focusin', () => { pulseFocusInside = true; });
    pulseCard.addEventListener('focusout', event => { if (!pulseCard.contains(event.relatedTarget)) pulseFocusInside = false; });
    setInterval(rotateTradePulse,8500);
    const categoryMatches = (item, category) => {
      if (item.category) return item.category === category.id;
      const text = `${item.title || ''} ${item.description || ''}`.toLocaleLowerCase();
      return category.keywords.some(word => text.includes(word.toLocaleLowerCase()));
    };
    const formatPublished = value => {
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? (window.siteLanguage === 'en' ? 'Time unavailable' : '时间未知') : new Intl.DateTimeFormat(window.siteLanguage === 'en' ? 'en-US' : 'zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }).format(date);
    };
    const fetchOfficialTradeUpdates = async () => {
      const endpoint = new URL('trade-updates.json', document.baseURI);
      endpoint.searchParams.set('t', String(Date.now()));
      const response = await fetch(endpoint, { cache:'no-store', headers:{ 'Accept':'application/json' } });
      if (!response.ok) throw new Error(`Official trade feed request failed (${response.status})`);
      const payload = await response.json();
      if (!payload || !Array.isArray(payload.items)) throw new Error('Official trade feed has an unexpected format');
      return payload;
    };
    const plainText = markup => new DOMParser().parseFromString(markup || '', 'text/html').body.textContent.replace(/\s+/g, ' ').trim();
    let moduleLeaveTimer = null;
    const setActiveModule = (module, category) => {
      clearTimeout(moduleLeaveTimer);
      moduleLeaveTimer = null;
      list.classList.add('has-active');
      list.dataset.active = category.id;
      list.querySelectorAll('.news-module').forEach(item => {
        const active = item === module;
        item.classList.toggle('is-active', active);
        item.querySelectorAll('.news-story').forEach(story => { story.inert = !active; });
      });
    };
    const clearActiveModule = () => {
      clearTimeout(moduleLeaveTimer);
      moduleLeaveTimer = null;
      list.classList.remove('has-active');
      delete list.dataset.active;
      list.querySelectorAll('.news-module').forEach(item => {
        item.classList.remove('is-active');
        item.querySelectorAll('.news-story').forEach(story => { story.inert = true; });
      });
    };
    const deferClearActiveModule = delay => {
      clearTimeout(moduleLeaveTimer);
      moduleLeaveTimer = setTimeout(() => {
        moduleLeaveTimer = null;
        clearActiveModule();
      }, delay);
    };
    const renderNews = () => {
      clearActiveModule();
      updateTradePulse();
      const modules = categories.map((category, index) => {
        const module = document.createElement('section');
        module.className = `news-module news-module-${category.id}`;
        module.style.setProperty('--module-image', `url("${category.image}")`);
        module.tabIndex = 0;
        const categoryTitle = window.siteT(category.titleKey);
        const categorySubtitle = window.siteT(category.subtitleKey);
        module.setAttribute('aria-label', categoryTitle);
        const matchingItems = visibleNewsItems()
          .filter(item => categoryMatches(item, category) && !isMarketReportHeadline(item))
          .sort((a,b) => new Date(b.pubDate).getTime() - new Date(a.pubDate).getTime());
        const related = matchingItems.slice(0, 4);
        const head = document.createElement('header');
        head.className = 'news-module-head';
        const number = document.createElement('span');
        number.className = 'news-module-index';
        number.textContent = `0${index + 1} / ${window.siteT('news_topic_word')}`;
        const title = document.createElement('h2');
        const icon = document.createElement('img');
        icon.className = 'news-topic-icon';
        icon.src = category.icon;
        icon.alt = '';
        icon.setAttribute('aria-hidden', 'true');
        title.append(icon, document.createTextNode(categoryTitle));
        const subtitle = document.createElement('span');
        subtitle.className = 'news-module-count';
        subtitle.textContent = matchingItems.length ? `${matchingItems.length} ${window.siteT('news_count')} · ${categorySubtitle}` : `${window.siteT('news_empty_count')} · ${categorySubtitle}`;
        head.append(number, title, subtitle);
        const stories = document.createElement('div');
        stories.className = 'news-module-stories';
        const openTopic = document.createElement('button');
        openTopic.type = 'button';
        openTopic.className = 'news-topic-open';
        openTopic.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>';
        openTopic.setAttribute('aria-label', `${window.siteT('topic_open')}: ${categoryTitle}`);
        openTopic.title = `${window.siteT('topic_open')}: ${categoryTitle}`;
        openTopic.addEventListener('click', () => showTopicPage(category));
        if (!related.length) {
          const empty = document.createElement('div');
          empty.className = 'news-empty-state';
          const message = document.createElement('p');
          const selectedRegion = selectedRegionData();
          const noMatchMessage = selectedRegion
            ? (window.siteLanguage === 'en' ? `No ${categoryTitle} stories for ${selectedRegion.en} yet.` : `暂无${selectedRegion.zh}${categoryTitle}相关新闻。`)
            : window.siteT('news_no_matches');
          message.textContent = newsUnavailable ? window.siteT('news_unavailable') : isLoading ? window.siteT('news_fetching') : newsItems.length ? noMatchMessage : window.siteT('news_enter');
          const art = document.createElement('img');
          art.src = category.image;
          art.alt = '';
          art.loading = 'lazy';
          empty.append(message, art);
          stories.append(empty);
        }
        related.forEach((item, storyIndex) => {
          const story = document.createElement('a');
          story.className = 'news-story';
          story.href = item.link;
          story.target = '_blank';
          story.rel = 'noopener noreferrer';
          story.inert = true;
          const fullTitle = item.title || window.siteT('story_fallback');
          const separator = fullTitle.lastIndexOf(' - ');
          const publisher = separator > 0 ? fullTitle.slice(separator + 3) : '';
          const storyTitle = document.createElement('h3');
          storyTitle.textContent = publisher ? fullTitle.slice(0, separator) : fullTitle;
          const summary = document.createElement('p');
          summary.className = 'news-story-summary';
          summary.textContent = plainText(item.description).slice(0, 220) || window.siteT('open_original');
          const meta = document.createElement('div');
          meta.className = 'news-story-meta';
          const source = document.createElement('span');
          source.className = 'news-story-source';
          source.textContent = item.author || publisher || window.siteT('official_trade_source');
          const time = document.createElement('time');
          if (item.pubDate && !Number.isNaN(new Date(item.pubDate).getTime())) time.dateTime = new Date(item.pubDate).toISOString();
          time.textContent = formatPublished(item.pubDate);
          meta.append(source, time);
          story.append(storyTitle, summary, meta);
          stories.append(story);
        });
        module.append(head, stories, openTopic);
        module.addEventListener('pointerenter', () => setActiveModule(module, category));
        module.addEventListener('pointerleave', event => {
          const nextModule = event.relatedTarget instanceof Element ? event.relatedTarget.closest('.news-module') : null;
          if (!nextModule || !list.contains(nextModule)) deferClearActiveModule(140);
        });
        module.addEventListener('focusin', () => setActiveModule(module, category));
        module.addEventListener('focusout', event => {
          const nextModule = event.relatedTarget instanceof Element ? event.relatedTarget.closest('.news-module') : null;
          if (!nextModule || !list.contains(nextModule)) deferClearActiveModule(80);
        });
        return module;
      });
      list.replaceChildren(...modules);
      list.setAttribute('aria-busy', String(isLoading));
    };
    const loadNews = async ({ manual = false, force = false } = {}) => {
      if (isLoading || Date.now() < refreshCooldownUntil) return;
      if (!manual && !force && newsItems.length && lastUpdatedAt && Date.now() - lastUpdatedAt.getTime() < 15 * 60 * 1000) {
        newsUnavailable = false;
        renderNews();
        updated.dataset.state = 'live';
        updated.textContent = `${window.siteT('news_updated')} ${new Intl.DateTimeFormat(window.siteLanguage === 'en' ? 'en-US' : 'zh-CN', { hour:'2-digit', minute:'2-digit', second:'2-digit' }).format(lastUpdatedAt)}`;
        return;
      }
      if (manual) startRefreshCooldown();
      isLoading = true;
      newsUnavailable = false;
      updateRefreshButton();
      if (!newsItems.length) renderNews();
      list.setAttribute('aria-busy', 'true');
      updated.dataset.state = 'loading';
      updated.textContent = window.siteT('news_updating');
      try {
        const payload = await fetchOfficialTradeUpdates();
        newsItems = payload.items
          .filter(item => item && item.title && item.link && item.pubDate)
          .map(item => ({ ...item, description:item.description || '', author:item.author || window.siteT('official_trade_source') }));
        activePulseIndex = 0;
        topicCache.clear();
        if (!newsItems.length) throw new Error(window.siteT('official_trade_no_results'));
        newsUnavailable = false;
        lastUpdatedAt = payload.updatedAt ? new Date(payload.updatedAt) : new Date();
        try { localStorage.setItem(newsCacheKey, JSON.stringify({ articles:newsItems, fetchedAt:lastUpdatedAt.getTime() })); } catch {}
        renderNews();
        updated.dataset.state = 'live';
        updated.textContent = `${window.siteT('news_updated')} ${new Intl.DateTimeFormat(window.siteLanguage === 'en' ? 'en-US' : 'zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' }).format(lastUpdatedAt)}`;
      } catch (error) {
        console.error('International trade news fetch failed:', error);
        newsUnavailable = true;
        if (newsItems.length) {
          renderNews();
          updated.dataset.state = 'error';
          updated.textContent = window.siteT('news_failed_cached');
        } else {
          renderNews();
          updated.dataset.state = 'error';
          updated.textContent = window.siteT('news_failed');
        }
      } finally {
        isLoading = false;
        updateRefreshButton();
        list.setAttribute('aria-busy', 'false');
      }
    };
    updateRefreshButton();
    refreshButton.addEventListener('click', () => loadNews({ manual:true }));
    updateMapLabels();
    updateMapSelection();
    renderNews();
    window.addEventListener('site-language-change', () => {
      updateMapLabels();
      updateMapSelection();
      renderNews();
      updateRefreshButton();
      if (isLoading) updated.textContent = window.siteT('news_updating');
      else if (newsUnavailable) updated.textContent = newsItems.length ? window.siteT('news_failed_cached') : window.siteT('news_failed');
      else if (lastUpdatedAt) updated.textContent = `${window.siteT('news_updated')} ${new Intl.DateTimeFormat(window.siteLanguage === 'en' ? 'en-US' : 'zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' }).format(lastUpdatedAt)}`;
      else if (!newsItems.length) updated.textContent = window.siteT('news_connecting');
    });
    window.addEventListener('world-page-open', loadNews);
    if ('IntersectionObserver' in window) {
      const observer = new IntersectionObserver(entries => {
        const entry = entries.find(item => item.target.id === 'world-page');
        if (!entry) return;
        isNewsVisible = entry.isIntersecting;
        if (isNewsVisible) loadNews();
      }, { rootMargin: '300px 0px' });
      observer.observe(document.querySelector('#world-page'));
      const transitionObserver = new IntersectionObserver(entries => {
        const enteringNews = entries.some(entry => entry.isIntersecting);
        document.querySelector('#world-page').classList.toggle('is-active', enteringNews);
        document.querySelector('#hero').classList.toggle('transition-away', enteringNews);
      }, { rootMargin: '-18% 0px -18% 0px' });
      transitionObserver.observe(document.querySelector('#world-page'));
    }
    setInterval(() => { if (document.visibilityState === 'visible') loadNews({ force:true }); }, 10 * 60 * 1000);
    loadNews({ force:true });
    const initialTopic=location.hash.match(/^#topic-(policy|tariff|supply)(?:\?region=([a-z-]+))?$/);
    if(initialTopic) showTopicPage(categories.find(category=>category.id===initialTopic[1]),{pushHistory:false,regionId:initialTopic[2] || null});
  </script>
</body>
</html>
